# Publishes SoundSense Lite (the no-login edition in /lite) to GitHub Pages.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
# (GitHub Pages needs a public repository on the free plan.)
name: Deploy SoundSense Lite to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["lite/**", ".github/workflows/lite-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lite/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build static site (under /<repository-name>)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npm run typecheck
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lite/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
